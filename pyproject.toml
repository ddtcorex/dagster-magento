[project]
name = "dagster-magento"
version = "0.5.0"
description = "Reusable Dagster resource for Magento 2 REST integrations"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # 1.13.17 is the version this repo's own test suite (dagster__is_secret
    # password masking, EnvVar-backed resources) is actually verified against
    # in .venv - the prior ">=1.5" floor was an unverified guess.
    "dagster>=1.13.17",
    "requests>=2.28",
    "pydantic>=2",
]

[project.optional-dependencies]
xlsx = [
    "openpyxl>=3.1",
]
dev = [
    "pytest>=7",
    "requests-mock>=1.11",
    "openpyxl>=3.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dagster_magento"]

[tool.pytest.ini_options]
markers = [
    "live: hits a real Magento instance over HTTP; excluded by default",
    "samples: downloads real sample files from the Firebear sample repo over HTTP; excluded by default",
]
addopts = "-m 'not live and not samples'"
