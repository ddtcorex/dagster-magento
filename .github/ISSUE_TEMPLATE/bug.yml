name: Bug Report
description: Report a reproducible bug in dagster-magento.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Before filing, please search existing issues to avoid duplicates.
        For security vulnerabilities, use private reporting: https://github.com/ddtcorex/dagster-magento/security/advisories

  - type: input
    id: version
    attributes:
      label: Library version
      description: The installed version or the commit you are running
      placeholder: "0.2.0"
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of the library is affected?
      options:
        - Resource primitives (auth, retry, get/post/put/delete)
        - Search criteria builder
        - Sync uploads (upload_rows / UploadResult)
        - Async bulk (upload_rows_async, submit_bulk, wait_bulk)
        - Catalog import (importers, writers, diff, resolvers, models)
        - File adapters (csv / json / xlsx columns)
        - Sandbox or live tests
        - Documentation
        - Other
    validations:
      required: true

  - type: dropdown
    id: mode
    attributes:
      label: Execution mode
      options:
        - sync
        - bulk
        - not applicable (primitives / adapters)
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Python, Dagster and Magento versions
      render: bash
      placeholder: |
        uname -a
        .venv/bin/python --version
        .venv/bin/pip show dagster | head -2
        # Magento: bin/magento --version (Open Source or Commerce)
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
        3. Observe error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include the UploadResult counts and `errors` entries when the bug is a row outcome
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or screenshots
      description: Redact tokens, passwords and customer data before pasting
      render: shell
